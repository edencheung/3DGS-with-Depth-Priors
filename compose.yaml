services:
  dngaussian:
    image: dngaussian:v1
    build:
      context: .
      dockerfile: dockerfile
      args:
        CUDA_ARCH_LIST: "${CUDA_ARCH_LIST:-12.0}"
    working_dir: /app
    volumes:
      - .:/app
      - cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  cache:
    name: dngaussian-cache
